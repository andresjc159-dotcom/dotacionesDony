{% extends "base.html" %}

{% block title %}Abrir caja — Dotaciones Dony{% endblock %}

{% block content %}
<div class="topbar">
  <div><h1 style="font-size:1.9rem;">Abrir caja</h1>
    <p style="color:var(--text-mid); margin:0;">Registra el dinero con el que inicia la caja hoy.</p>
  </div>
</div>

<div class="card" style="max-width:420px;">
  <form method="post" action="{% url 'pos:abrir' %}">
    {% csrf_token %}
    {% include "includes/generic_fields.html" with form=form %}
    <button class="btn btn-primary btn-block" type="submit">Abrir caja</button>
  </form>
</div>
{% endblock %}
