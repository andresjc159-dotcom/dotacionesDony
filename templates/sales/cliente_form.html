{% extends "base.html" %}

{% block title %}{{ titulo }} — Dotaciones Dony{% endblock %}

{% block content %}
<div class="topbar">
  <div><h1 style="font-size:1.9rem;">{{ titulo }}</h1></div>
  <a class="btn btn-ghost btn-sm" href="{% url 'sales:clientes' %}">← Volver</a>
</div>

<form method="post" novalidate>
  {% csrf_token %}
  <div class="card">
    {% include "includes/generic_fields.html" with form=form %}
  </div>
  <button class="btn btn-primary" type="submit" style="margin-top:1.25rem;">Guardar</button>
</form>
{% endblock %}
