{% extends "base.html" %}

{% block title %}Nueva transferencia — Dotaciones Dony{% endblock %}

{% block content %}
<div class="topbar">
  <div><h1 style="font-size:1.9rem;">Nueva transferencia</h1></div>
  <a class="btn btn-ghost btn-sm" href="{% url 'warehouse:transferencias' %}">← Volver</a>
</div>

<form method="post" novalidate>
  {% csrf_token %}
  <div class="card">
    {% include "includes/generic_fields.html" with form=form %}
  </div>
  <button class="btn btn-primary" type="submit" style="margin-top:1.25rem;">Transferir</button>
</form>
{% endblock %}
