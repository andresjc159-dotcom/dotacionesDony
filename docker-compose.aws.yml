# Docker Compose para AWS — despliegue CERO COSTO (una sola instancia EC2 free tier).
# Incluye PostgreSQL y Redis en contenedores (sin RDS ni ElastiCache, que son de pago).
# Uso: cp .env.production.example .env.production && docker compose -f docker-compose.aws.yml up -d --build

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dotaciones_dony}
      POSTGRES_USER: ${POSTGRES_USER:-dony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dony}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate --settings=config.settings.prod &&
             python manage.py collectstatic --noinput --settings=config.settings.prod &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120"
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  lb:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  worker:
    build: .
    restart: always
    command: celery -A config worker -l info
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      - web
      - db
      - redis

volumes:
  pgdata:
  media_data:
