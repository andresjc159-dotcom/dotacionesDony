# Nginx como balanceador de carga (round-robin dinámico sobre Docker)
# Usa el DNS interno de Docker (127.0.0.11) para re-resolver "web" en cada
# petición, de modo que al escalar réplicas (--scale web=N) el balanceo se
# actualiza automáticamente sin recargar Nginx.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $backend http://web:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reenvía el protocolo original que envía Caddy (https) para que
        # Django sepa que la conexión es segura y no haga redirecciones.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
